[project]
name = "public-benchmark"
version = "0.0.0"
description = "PROTOTYPE: benchmark pretrained lip-reading models on public test sets"
requires-python = "==3.11.*"
dependencies = [
    "torch==2.5.1",
    "torchvision==0.20.1",
    "torchaudio==2.5.1",
    "pytorch-lightning>=2.0,<2.5",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "sentencepiece",
    "six",
    "numpy<2",
    "pyarrow",
    "opencv-python-headless",
    "lips",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }
lips = { path = "../..", editable = true }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
